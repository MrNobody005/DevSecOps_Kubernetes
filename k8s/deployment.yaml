apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-web
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-web
  template:
    metadata:
      labels:
        app: devsecops-web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: web
          image: devsecops-kubernetes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DJANGO_SETTINGS_MODULE
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DEBUG
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devsecops-secret
                  key: SECRET_KEY
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devsecops-secret
                  key: TMDB_API_KEY
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: devsecops-config
                  key: DB_PORT
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
